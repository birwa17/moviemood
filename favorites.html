<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Watchlist | MovieMood</title>
<link rel="stylesheet" href="css/style.css">
<script>document.documentElement.setAttribute('data-theme', localStorage.getItem('theme') || 'light');</script>
</head>
<body>
<div id="header"></div>
<main class="container" id="app">

<h2>❤️ My Watchlist</h2>
<p id="empty" style="display:none">Your watchlist is empty. <a href="recommend.html">Find some movies</a>.</p>
<div class="grid" id="list"></div>

</main>
<div id="footer"></div>
<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script>

if (requireLogin()) {
  var user = currentUser();
  function drawFav() {
    var ids = getFav(user.id);
    var html = '';
    ids.forEach(function (id) {
      var m = findMovie(id);
      if (m) html += '<div>' + movieCard(m) + '<button class="link-btn" style="display:block;margin:6px auto" onclick="removeFav(' + id + ')">Remove</button></div>';
    });
    document.getElementById('list').innerHTML = html;
    document.getElementById('empty').style.display = html ? 'none' : 'block';
  }
  function removeFav(id) {
    var list = getFav(user.id).filter(function (x) { return x !== id; });
    saveFav(user.id, list);
    drawFav();
  }
  drawFav();
}

</script>
</body>
</html>
