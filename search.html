<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Search | MovieMood</title>
<link rel="stylesheet" href="css/style.css">
<script>document.documentElement.setAttribute('data-theme', localStorage.getItem('theme') || 'light');</script>
</head>
<body>
<div id="header"></div>
<main class="container" id="app">

<h2>🔎 Search Movies</h2>
<input type="text" id="q" class="live-filter" placeholder="Search by movie, actor, actress or genre...">
<div class="grid" id="results"></div>
<p id="none" style="display:none">No movies found.</p>

</main>
<div id="footer"></div>
<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script>

var all = getMovies();
function showResults() {
  var q = document.getElementById('q').value.trim().toLowerCase();
  var list = all.filter(function (m) {
    var text = (m.title + ' ' + m.hero + ' ' + m.heroine + ' ' + m.genre).toLowerCase();
    return text.indexOf(q) > -1;
  });
  document.getElementById('results').innerHTML = list.map(movieCard).join('');
  document.getElementById('none').style.display = list.length ? 'none' : 'block';
}
document.getElementById('q').addEventListener('keyup', showResults);
showResults();

</script>
</body>
</html>
