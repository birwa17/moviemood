<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Register | MovieMood</title>
<link rel="stylesheet" href="css/style.css">
<script>document.documentElement.setAttribute('data-theme', localStorage.getItem('theme') || 'light');</script>
</head>
<body>
<div id="header"></div>
<main class="container" id="app">

<div class="form-box">
  <h2>Create Account</h2>
  <div id="msg"></div>
  <form id="registerForm">
    <label>Name</label><input type="text" id="name" required>
    <label>Email</label><input type="email" id="email" required>
    <label>Password</label><input type="password" id="password" required>
    <label>Confirm Password</label><input type="password" id="confirm" required>
    <button class="btn" type="submit">Register</button>
  </form>
  <p>Already have an account? <a href="login.html">Login</a></p>
</div>

</main>
<div id="footer"></div>
<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script>

document.getElementById('registerForm').addEventListener('submit', function (e) {
  e.preventDefault();
  var name = document.getElementById('name').value.trim();
  var email = document.getElementById('email').value.trim().toLowerCase();
  var pass = document.getElementById('password').value;
  var confirm = document.getElementById('confirm').value;
  var msg = document.getElementById('msg');
  var users = getUsers();

  if (pass.length < 6) { msg.innerHTML = '<div class="alert error">Password must be at least 6 characters.</div>'; return; }
  if (pass !== confirm) { msg.innerHTML = '<div class="alert error">Passwords do not match.</div>'; return; }
  for (var i = 0; i < users.length; i++) {
    if (users[i].email === email) { msg.innerHTML = '<div class="alert error">This email is already registered.</div>'; return; }
  }
  users.push({ id: Date.now(), name: name, email: email, password: pass, role: 'user' });
  saveUsers(users);
  flash('Registration successful! Please login.');
  location.href = 'login.html';
});

</script>
</body>
</html>
